<style>

<header style="height:80px;display:flex;align-items:center;padding:0 40px;gap:18px">

        <svg width="84" height="84" viewBox="0 0 21 21" shape-rendering="crispEdges"><path fill="#1F1F1D" d="M0 0h7v7H0zM1 1v5h5V1zM2 2h3v3H2zM14 0h7v7h-7zM15 1v5h5V1zM16 2h3v3h-3zM0 14h7v7H0zM1 15v5h5v-5zM2 16h3v3H2zM8 0h1v1H8zM10 1h2v1h-2zM9 3h1v2H9zM11 4h2v1h-2zM8 6h1v1H8zM10 6h1v1h-1zM12 6h1v2h-1zM0 8h2v1H0zM3 8h1v2H3zM5 9h3v1H5zM9 8h2v1H9zM13 9h2v1h-2zM16 8h1v2h-1zM18 9h3v1h-3zM1 11h1v2H1zM4 11h2v1H4zM7 11h1v2H7zM9 10h1v3H9zM11 11h3v1h-3zM15 11h1v1h-1zM17 11h2v2h-2zM20 12h1v1h-1zM8 14h2v1H8zM11 13h1v2h-1zM13 14h2v1h-2zM16 14h1v2h-1zM19 14h2v1h-2zM8 16h1v2H8zM10 17h2v1h-2zM13 16h1v1h-1zM15 17h3v1h-3zM19 17h1v2h-1zM9 19h2v1H9zM12 19h1v2h-1zM14 19h2v1h-2zM17 20h4v1h-4z"/></svg>

    </div>

    <span class="t" style="font-size:44px;font-weight:700;line-height:1">К кому<br>идёт</span>
