<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>E · Тишина — регистрация</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Commissioner:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400&display=swap">
<style>
*{box-sizing:border-box}body{margin:0;width:1440px;height:900px;overflow:hidden;font-family:Commissioner,sans-serif;color:#15232B;
background:radial-gradient(1200px 700px at 20% -10%,#FFFFFF 0%,rgba(255,255,255,0) 60%),linear-gradient(180deg,#EEF2F4 0%,#E3E9EC 100%)}
.mono{font-family:'JetBrains Mono',monospace}
button,input{font-family:inherit}
.f{display:flex;flex-direction:column;gap:8px}
.l{font-size:14px;color:#6B7A83;padding-left:4px}
.i{height:64px;border-radius:20px;border:1px solid #DCE3E7;background:#FFFFFF;padding:0 22px;font-size:19px;color:#15232B;outline:0;display:flex;align-items:center}
</style></head><body>
<header style="height:84px;display:flex;align-items:center;padding:0 40px;gap:16px">
  <span style="width:40px;height:40px;border-radius:50%;background:#0E6E62;display:flex;align-items:center;justify-content:center"><span style="width:14px;height:14px;border-radius:50%;border:2.5px solid #fff"></span></span>
  <span style="font-size:18px;font-weight:600">Бюро пропусков</span>
  <span style="flex:1"></span>
  <span style="display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;background:rgba(255,255,255,.7);font-size:14px;color:#0E6E62"><span style="width:8px;height:8px;border-radius:50%;background:#0E6E62"></span>Сканер готов</span>
  <span style="font-size:15px;color:#6B7A83">Бекова Ж. Т.</span>
  <button style="height:44px;padding:0 18px;border-radius:999px;border:0;background:rgba(255,255,255,.7);font-size:14px;color:#15232B">Выйти</button>
</header>

<main style="display:flex;justify-content:center;gap:28px;padding-top:6px">
  <form style="width:640px;background:rgba(255,255,255,.72);border-radius:40px;padding:36px 44px 40px;display:flex;flex-direction:column;gap:22px;box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 30px 60px -30px rgba(21,35,43,.25)">
    <div style="display:flex;align-items:center;gap:24px">
      <button type="button" aria-label="Сделать фото" style="width:132px;height:132px;border-radius:50%;border:0;padding:0;background:conic-gradient(#0E6E62 0 72%,#DCE3E7 72% 100%);display:flex;align-items:center;justify-content:center;flex-shrink:0">
        <span style="width:120px;height:120px;border-radius:50%;background:#E8EEF1;display:flex;align-items:center;justify-content:center;border:4px solid #fff">
          <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#8FA0A9" stroke-width="1.6" stroke-linecap="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
        </span>
      </button>
      <div style="display:flex;flex-direction:column;gap:6px">
        <h1 style="margin:0;font-size:36px;font-weight:600;letter-spacing:-.02em">Новый посетитель</h1>
        <span style="font-size:16px;color:#6B7A83">Коснитесь круга, чтобы сделать фото</span>
        <span class="mono" style="font-size:14px;color:#8FA0A9">30.09.2026 · 14:32</span>
      </div>
    </div>

    <div style="display:flex;gap:6px;padding:6px;border-radius:22px;background:#E8EEF1">
      <button type="button" style="flex:1;height:52px;border-radius:17px;border:0;background:#fff;font-size:17px;font-weight:600;color:#15232B;box-shadow:0 2px 8px -4px rgba(21,35,43,.3)">Физ. лицо</button>
      <button type="button" style="flex:1;height:52px;border-radius:17px;border:0;background:transparent;font-size:17px;color:#6B7A83">Юр. лицо</button>
      <button type="button" style="flex:1;height:52px;border-radius:17px;border:0;background:transparent;font-size:17px;color:#6B7A83">Гос. орган</button>
    </div>

    <label class="f"><span class="l">ФИО</span><input class="i" value="Сейткали Айгерим Нурлановна"></label>
    <label class="f"><span class="l">ИИН</span>
      <span class="i" style="justify-content:space-between;border-color:#0E6E62;box-shadow:0 0 0 4px rgba(14,110,98,.12)"><span class="mono" style="font-size:20px;letter-spacing:.1em">950412 400321</span><span style="width:30px;height:30px;border-radius:50%;background:#0E6E62;color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px">✓</span></span></label>
    <label class="f"><span class="l">К кому</span>
      <span class="i" style="gap:14px;padding-left:10px"><span style="width:44px;height:44px;border-radius:50%;background:#D6ECE8;color:#0E6E62;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px">ЕД</span><span style="flex:1;display:flex;flex-direction:column"><span style="font-size:18px">Ержанов Данияр Кайратович</span><span style="font-size:13px;color:#6B7A83">Начальник отдела · Кадровая работа</span></span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8FA0A9" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg></span></label>

    <button type="submit" style="margin-top:8px;height:80px;border-radius:999px;border:0;background:#0E6E62;color:#fff;font-size:21px;font-weight:600;letter-spacing:.01em">Выдать пропуск</button>
  </form>

  <aside style="width:300px;display:flex;flex-direction:column;gap:14px;padding-top:4px">
    <div style="padding:24px 26px;border-radius:32px;background:rgba(255,255,255,.55)">
      <div style="font-size:14px;color:#6B7A83">Сейчас в здании</div>
      <div style="font-size:64px;font-weight:300;letter-spacing:-.03em;line-height:1.1">12</div>
    </div>
    <div style="padding:22px 26px;border-radius:32px;background:rgba(255,255,255,.55);display:flex;flex-direction:column;gap:14px">
      <div style="font-size:14px;color:#6B7A83">Последние</div>
      <div style="display:flex;align-items:center;gap:12px"><span style="width:40px;height:40px;border-radius:50%;background:#E3D9F2"></span><span style="flex:1;font-size:15px">Жумабеков А.</span><span class="mono" style="font-size:13px;color:#8FA0A9">11:34</span></div>
      <div style="display:flex;align-items:center;gap:12px"><span style="width:40px;height:40px;border-radius:50%;background:#F2E3D6"></span><span style="flex:1;font-size:15px">ТОО «Астана Л.»</span><span class="mono" style="font-size:13px;color:#8FA0A9">10:17</span></div>
      <div style="display:flex;align-items:center;gap:12px"><span style="width:40px;height:40px;border-radius:50%;background:#D6ECE8"></span><span style="flex:1;font-size:15px">Ахметова Д.</span><span class="mono" style="font-size:13px;color:#8FA0A9">09:02</span></div>
    </div>
  </aside>
</main>
</body></html>
