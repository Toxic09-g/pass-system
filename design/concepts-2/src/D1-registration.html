<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>D · Табло — регистрация</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
*{box-sizing:border-box}body{margin:0;width:1440px;height:900px;overflow:hidden;background:#FFFFFF;color:#0A0A0A;font-family:'IBM Plex Sans',sans-serif}
.mono{font-family:'IBM Plex Mono',monospace}.cond{font-family:'IBM Plex Sans Condensed',sans-serif}
header{height:88px;display:flex;align-items:center;padding:0 48px;border-bottom:6px solid #0A0A0A;gap:32px}
.row{display:grid;grid-template-columns:96px 200px 1fr;align-items:center;border-bottom:2px solid #0A0A0A;min-height:112px}
.num{font-family:'IBM Plex Sans Condensed';font-weight:700;font-size:56px;padding-left:48px}
.lab{font-size:15px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
.val{font-size:36px;font-weight:500;letter-spacing:-.01em;padding-right:48px}
input{font:inherit;border:0;outline:0;background:transparent;width:100%;color:inherit}
button{font-family:inherit;cursor:pointer}
.seg{display:flex;gap:0;border:2px solid #0A0A0A;width:max-content}
.seg button{height:72px;padding:0 34px;border:0;border-right:2px solid #0A0A0A;background:#fff;font-size:22px;font-weight:600}
.seg button:last-child{border-right:0}.seg .on{background:#0A0A0A;color:#fff}
</style></head><body>
<header>
  <span class="cond" style="font-size:28px;font-weight:700;letter-spacing:.02em">БЮРО ПРОПУСКОВ</span>
  <span style="font-size:15px;color:#555">РОВД Есильского района г. Астаны</span>
  <span style="flex:1"></span>
  <span style="display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;letter-spacing:.1em"><span style="width:12px;height:12px;background:#E0201B"></span>СКАНЕР QR</span>
  <span class="mono" style="font-size:40px;font-weight:500">14:32</span>
  <span style="font-size:15px">Дежурный: <b>Бекова Ж. Т.</b></span>
  <button style="height:48px;padding:0 20px;border:2px solid #0A0A0A;background:#fff;font-size:15px;font-weight:600">Выйти</button>
</header>
<div style="display:grid;grid-template-columns:1fr 460px;height:812px">
  <form style="display:flex;flex-direction:column;border-right:6px solid #0A0A0A">
    <div style="display:flex;align-items:flex-end;justify-content:space-between;padding:28px 48px 20px;border-bottom:2px solid #0A0A0A">
      <h1 class="cond" style="margin:0;font-size:96px;line-height:.9;font-weight:700;letter-spacing:-.01em">ВХОД</h1>
      <span class="mono" style="font-size:24px">№ 000418 · 30.09.2026</span>
    </div>
    <div class="row"><span class="num">1</span><span class="lab">Кто</span>
      <div class="seg"><button type="button" class="on">Физ. лицо</button><button type="button">Юр. лицо</button><button type="button">Гос. орган</button></div></div>
    <div class="row"><span class="num">2</span><span class="lab">ФИО</span><input class="val" value="Сейткали Айгерим Нурлановна" aria-label="ФИО"></div>
    <div class="row"><span class="num">3</span><span class="lab">ИИН</span>
      <div style="display:flex;align-items:center;gap:20px;padding-right:48px"><input class="val mono" value="950412 400321" aria-label="ИИН" style="letter-spacing:.06em;font-weight:400"><span class="mono" style="font-size:18px;white-space:nowrap">12/12 ✓</span></div></div>
    <div class="row"><span class="num">4</span><span class="lab">К кому</span>
      <button type="button" style="border:0;background:none;text-align:left;padding:0 48px 0 0;display:flex;align-items:center;justify-content:space-between"><span style="display:flex;flex-direction:column;gap:4px"><span style="font-size:40px;font-weight:500">Ержанов Д. К.</span><span style="font-size:17px;color:#555">Начальник отдела · Управление кадровой работы</span></span><span style="font-size:32px">↓</span></button></div>
    <div style="flex:1"></div>
    <div style="display:grid;grid-template-columns:220px 1fr">
      <button type="reset" style="height:120px;border:0;border-top:2px solid #0A0A0A;border-right:2px solid #0A0A0A;background:#fff;font-size:20px;font-weight:600">Очистить</button>
      <button type="submit" class="cond" style="height:120px;border:0;background:#E0201B;color:#fff;font-size:48px;font-weight:700;letter-spacing:.02em;display:flex;align-items:center;justify-content:space-between;padding:0 48px">ВЫДАТЬ ПРОПУСК <span style="font-size:56px">→</span></button>
    </div>
  </form>
  <aside style="display:flex;flex-direction:column">
    <div style="display:flex;align-items:center;gap:16px;padding:28px 36px 20px;border-bottom:2px solid #0A0A0A"><span class="cond" style="font-size:56px;font-weight:700">5</span><span class="lab">Фото</span></div>
    <div style="flex:1;margin:28px 36px;background:#EDEDED;position:relative;display:flex;align-items:center;justify-content:center">
      <svg width="170" height="170" viewBox="0 0 24 24" fill="none" stroke="#B5B5B5" stroke-width=".9"><circle cx="12" cy="9" r="4"/><path d="M4 21c0-4.5 3.6-7 8-7s8 2.5 8 7"/></svg>
      <span style="position:absolute;left:0;top:0;width:44px;height:44px;border-left:6px solid #0A0A0A;border-top:6px solid #0A0A0A"></span>
      <span style="position:absolute;right:0;top:0;width:44px;height:44px;border-right:6px solid #0A0A0A;border-top:6px solid #0A0A0A"></span>
      <span style="position:absolute;left:0;bottom:0;width:44px;height:44px;border-left:6px solid #0A0A0A;border-bottom:6px solid #0A0A0A"></span>
      <span style="position:absolute;right:0;bottom:0;width:44px;height:44px;border-right:6px solid #0A0A0A;border-bottom:6px solid #0A0A0A"></span>
    </div>
    <button type="button" style="height:120px;border:0;border-top:2px solid #0A0A0A;background:#0A0A0A;color:#fff;font-size:24px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:16px"><span style="width:40px;height:40px;border-radius:50%;border:4px solid #fff"></span>Снять фото</button>
  </aside>
</div>
</body></html>
